name: Dependency Remediation

on:
  push:
    branches:
      - feat/preauth-edit-session

permissions:
  contents: write

concurrency:
  group: dependency-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, 'security: regenerate npm dependency lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from declared dependency policy
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply compatible npm audit remediations
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Verify dependency audit
        run: |
          npm audit --json > audit-after.json || audit_status=$?
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));
          const v = report.metadata?.vulnerabilities ?? {};
          console.log(JSON.stringify(v, null, 2));
          if ((v.high ?? 0) > 0 || (v.critical ?? 0) > 0) {
            console.error('High/critical vulnerabilities remain after non-forced remediation.');
            process.exit(1);
          }
          NODE
          if [ "${audit_status:-0}" -ne 0 ]; then
            echo 'npm audit returned a non-zero status because lower-severity advisories may remain; high/critical are the merge gate.'
          fi

      - name: Install exact lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Commit regenerated dependency lockfile
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo 'No dependency manifest changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json package.json
          git commit -m 'security: regenerate npm dependency lockfile [skip ci]'
          git push
