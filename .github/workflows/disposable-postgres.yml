name: Disposable PostgreSQL Migration Tests

on:
  push:
    branches:
      - main
      - development
      - "feat/**"
      - "fix/**"
      - feature/rap-reconciled
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: disposable-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Test-only normalization: the historical migration directory contains duplicate
      # 14-digit versions. Give later siblings unique temporary versions so the
      # disposable replay can execute every SQL file. This does not rename or
      # rewrite migration history in the repository or any hosted database.
      - name: Normalize duplicate migration versions for disposable replay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          directory = Path("supabase/migrations")
          groups = {}
          for path in sorted(directory.glob("*.sql")):
              match = re.match(r"^(\d{14})_(.+)$", path.name)
              if match:
                  groups.setdefault(match.group(1), []).append(path)

          used = {int(version) for version in groups}
          for version, paths in sorted(groups.items()):
              if len(paths) < 2:
                  continue
              next_version = int(version) + 1
              for path in paths[1:]:
                  while next_version in used:
                      next_version += 1
                  target = path.with_name(f"{next_version:014d}_{path.name[15:]}")
                  if target.exists():
                      raise SystemExit(f"Refusing to overwrite migration: {target}")
                  path.rename(target)
                  used.add(next_version)
                  print(f"TEST-ONLY VERSION MAP: {path.name} -> {target.name}")
                  next_version += 1
          PY

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      # Disposable local stack only; no project link or production credentials.
      - name: Start disposable local Supabase
        run: supabase start -x studio,mailpit,storage-api,edge-runtime,logflare,vector,imgproxy

      - name: Replay the complete migration chain on disposable PostgreSQL
        run: supabase db reset --local --no-seed

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run database SQL contract tests
        run: bash scripts/run-sql-contract-tests.sh

      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup
