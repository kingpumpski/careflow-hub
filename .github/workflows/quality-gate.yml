name: CareFlow Quality Gate

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --run
      - name: Backup and recovery tests
        run: npm run test:backup
      - name: Backup script syntax
        run: |
          node --check scripts/system-backup.mjs
          node --check scripts/verify-system-backup.mjs
          node --check scripts/restore-storage.mjs
      - name: Setup Deno for Supabase Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck backup portal Edge Function
        run: deno check --no-lock supabase/functions/backup-control/index.ts
      - name: Production build
        run: npm run build
