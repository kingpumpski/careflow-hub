name: CareFlow full-system backup

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for the operator-requested backup"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: careflow-system-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production-backup
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      BACKUP_R2_ACCOUNT_ID: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
      BACKUP_R2_ENDPOINT: https://${{ secrets.BACKUP_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Checkout immutable source commit
        uses: actions/checkout@v4

      - name: Verify approved project and required configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for name in SUPABASE_PROJECT_ID SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL BACKUP_AGE_RECIPIENT BACKUP_R2_ACCOUNT_ID BACKUP_R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required backup configuration (secret names only): %s\n' "${missing[*]}"
            exit 1
          fi

          if [[ "$SUPABASE_PROJECT_ID" != "jajfdgknctzqypdtvmxo" ]]; then
            echo "::error::SUPABASE_PROJECT_ID does not match the approved CareFlow production project."
            exit 1
          fi
          if [[ "$SUPABASE_URL" != "https://jajfdgknctzqypdtvmxo.supabase.co" ]]; then
            echo "::error::SUPABASE_URL does not match the approved CareFlow production project."
            exit 1
          fi
          if [[ "$BACKUP_AGE_RECIPIENT" != age1* ]]; then
            echo "::error::BACKUP_AGE_RECIPIENT must be an age public recipient (age1...)."
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" != postgresql://* && "$SUPABASE_DB_URL" != postgres://* ]]; then
            echo "::error::SUPABASE_DB_URL must be a PostgreSQL Session Pooler URI."
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" != *"sslmode=require"* ]]; then
            echo "::error::SUPABASE_DB_URL must require TLS with sslmode=require."
            exit 1
          fi

      - name: Install age encryption utility
        run: |
          sudo apt-get update
          sudo apt-get install --yes age
          age --version
          aws --version

      - name: Generate, encrypt, upload and verify complete backup
        id: create_backup
        run: node scripts/system-backup.mjs

      - name: Record safe completion summary
        if: success()
        run: echo "A verified encrypted CareFlow backup was committed to the private R2 backup bucket. No patient data or credentials are printed in this job summary."
