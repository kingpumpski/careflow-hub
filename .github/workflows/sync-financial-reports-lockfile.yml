name: Temporary PR lockfile alignment

on:
  push:
    branches:
      - feat/financial-reports-superuser-admin
    paths:
      - .github/workflows/sync-financial-reports-lockfile.yml

permissions:
  contents: write

jobs:
  align-lockfile:
    if: github.ref == 'refs/heads/feat/financial-reports-superuser-admin'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile from latest main manifest
        run: |
          git fetch origin main
          cp package.json /tmp/package.json.feature
          git show origin/main:package.json > package.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          mv /tmp/package.json.feature package.json
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches the current main manifest."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): align lockfile with current main manifest"
          git push origin HEAD:${{ github.ref_name }}
