name: Wire pre-authorization offline producer

on:
  push:
    branches: ["feat/optimistic-sync-conflict-guard"]

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, 'chore(sync): wire preauth offline producer') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire pre-authorization item producer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/PreAuthorizationStudio.tsx')
          s = p.read_text()
          old = 'useSupabaseInsert, useSupabaseQuery'
          new = 'useSupabaseBulkInsert, useSupabaseInsert, useSupabaseQuery'
          if old not in s:
              raise SystemExit('expected import marker not found')
          s = s.replace(old, new, 1)
          old = 'const insertPreauth = useSupabaseInsert("pre_authorizations");'
          new = old + '\n  const insertPreAuthItems = useSupabaseBulkInsert("preauth_items");'
          if 'const insertPreAuthItems = useSupabaseBulkInsert("preauth_items");' not in s:
              if old not in s:
                  raise SystemExit('expected preauth mutation marker not found')
              s = s.replace(old, new, 1)
          old = '''      if (rows.length) {\n        const { error } = await (supabase.from("preauth_items") as any).insert(rows);\n        if (error) throw error;\n      }'''
          new = '      if (rows.length) await insertPreAuthItems.mutateAsync(rows);'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'if (rows.length) await insertPreAuthItems.mutateAsync(rows);' not in s:
              raise SystemExit('expected direct item insert marker not found')
          p.write_text(s)
          PY
          rm .github/workflows/wire-preauth-offline-producer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/PreAuthorizationStudio.tsx .github/workflows/wire-preauth-offline-producer.yml
          git commit -m 'chore(sync): wire preauth offline producer'
          git push origin HEAD:${GITHUB_REF_NAME}
