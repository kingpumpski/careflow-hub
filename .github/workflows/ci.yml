name: CI

on:
  pull_request:
    branches: [main, development, "feat/**", "fix/**"]
  push:
    branches: [main, development, feature/rap-reconciled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: rap-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migration version integrity
        run: npm run verify:migrations
      - name: Read-only migration reconciliation audit
        run: npm run audit:migrations
      - name: Migration audit unit tests
        run: npm run test:migration-audit

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Backup and recovery tests
        run: npm run test:backup

      - name: Backup script syntax
        run: |
          node --check scripts/system-backup.mjs
          node --check scripts/verify-system-backup.mjs
          node --check scripts/restore-storage.mjs
          bash -n scripts/restore-system-backup.sh scripts/restore-database.sh

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: RAP PostgreSQL migration smoke test
        env:
          PGPASSWORD: rap-test-password
        run: bash scripts/test-rap-migrations.sh

      - name: Production build
        run: npm run build

      - name: Verify GitHub Pages hash routing
        run: npm run verify:pages
