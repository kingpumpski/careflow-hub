name: Preauth Lint Repair Once

on:
  push:
    branches:
      - feat/preauthorization-studio

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair hook lint naming
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/preauth/PreAuthTextFirstForm.tsx')
          s = p.read_text()
          s = s.replace('useSavedPatient', 'loadSavedPatient')
          s = s.replace('useSavedInsurer', 'loadSavedInsurer')
          p.write_text(s)
          PY
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/preauth/PreAuthTextFirstForm.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: resolve preauthorization form hook lint errors'
          git push
