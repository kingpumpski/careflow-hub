name: CareFlow Supabase Deploy

# Production schema and function deployment is intentionally manual.
# Configure required reviewers on the production-database GitHub Environment.
on:
  workflow_dispatch:
    inputs:
      migration_ledger_reconciled:
        description: "The remote migration ledger has been compared with repository migrations."
        required: true
        type: boolean
        default: false
      restored_backup_tested:
        description: "A restore test completed successfully against a separate target."
        required: true
        type: boolean
        default: false
      confirm_production_deploy:
        description: "I approve deployment to the configured production Supabase project."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: production-backup
    outputs:
      backup_id: ${{ steps.create_backup.outputs.backup_id }}
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      BACKUP_R2_ACCOUNT_ID: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
      BACKUP_R2_ENDPOINT: https://${{ secrets.BACKUP_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify approved project and backup configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_ID" = "jajfdgknctzqypdtvmxo"
          test "$SUPABASE_URL" = "https://jajfdgknctzqypdtvmxo.supabase.co"
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_SERVICE_ROLE_KEY BACKUP_AGE_RECIPIENT BACKUP_R2_ACCOUNT_ID BACKUP_R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing required secret $name"; exit 1; fi
          done
      - name: Install age encryption utility
        run: |
          sudo apt-get update
          sudo apt-get install --yes age
      - name: Create verified off-site backup before database deployment
        id: create_backup
        run: node scripts/system-backup.mjs

  deploy:
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-database
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate explicit release approvals and project identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.migration_ledger_reconciled }}" == "true" ]] || { echo "Migration ledger reconciliation is required."; exit 1; }
          [[ "${{ inputs.restored_backup_tested }}" == "true" ]] || { echo "A successful restore test is required."; exit 1; }
          [[ "${{ inputs.confirm_production_deploy }}" == "true" ]] || { echo "Explicit production deployment confirmation is required."; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing production environment secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "Missing production environment secret SUPABASE_PROJECT_ID"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing production environment secret SUPABASE_DB_PASSWORD"; exit 1; }
          expected_ref="$(sed -n 's/^project_id = "\([^"]*\)".*/\1/p' supabase/config.toml)"
          test -n "$expected_ref" || { echo "Could not read project_id from supabase/config.toml"; exit 1; }
          test "$SUPABASE_PROJECT_ID" = "$expected_ref" || {
            echo "Configured production project ref does not match supabase/config.toml."
            exit 1
          }
          echo "Verified backup ID: ${{ needs.backup.outputs.backup_id }}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Review remote migration ledger
        run: supabase migration list --linked

      - name: Preview database changes
        run: supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
