name: Dependency Security Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Dependency remediation is intentionally deferred while the pre-authorization
      # foundation is being stabilized. Pull requests still generate the complete
      # report, but known findings do not block feature validation. Main/scheduled
      # runs remain strict so the debt cannot disappear silently.
      - name: Production dependency audit
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit report
        if: always()
        run: npm audit --audit-level=moderate --json > npm-audit.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 14

      - name: Edge function security invariants
        shell: bash
        run: |
          set -euo pipefail
          fail=0

          # Browser-facing application functions must never fall back to wildcard CORS.
          if grep -RInE "Access-Control-Allow-Origin[^\n]*\\*|[=:][[:space:]]*['\"]\\*['\"]" supabase/functions --include='*.ts' --exclude-dir=node_modules; then
            echo "Wildcard CORS detected in an Edge Function."
            fail=1
          fi

          # AI data paths must execute in the caller's RLS context, not with service-role.
          if grep -nE "SERVICE_ROLE|service_role|SUPABASE_SERVICE_ROLE_KEY" supabase/functions/chat/index.ts supabase/functions/ai-dedup-check/index.ts; then
            echo "Service-role credential detected in an AI data path."
            fail=1
          fi

          # These application functions are required to have gateway JWT verification.
          for fn in chat ai-dedup-check admin-user-action; do
            grep -q "\[functions\\.$fn\]" supabase/config.toml || { echo "Missing config block for $fn"; fail=1; }
            awk "/\\[functions\\.$fn\\]/{flag=1;next}/\\[functions\\./{flag=0}flag" supabase/config.toml | grep -q "verify_jwt[[:space:]]*=[[:space:]]*true" || { echo "JWT verification not enabled for $fn"; fail=1; }
          done

          exit "$fail"
