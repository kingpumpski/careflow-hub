name: Dependency Security Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Dependency remediation is intentionally deferred while the pre-authorization
      # foundation is being stabilized. Pull requests still generate the complete
      # report, but known findings do not block feature validation. Main/scheduled
      # runs remain strict so the debt cannot disappear silently.
      - name: Production dependency audit
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit report
        if: always()
        run: npm audit --audit-level=moderate --json > npm-audit.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 14
