name: Deploy CareFlow Hub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Verify SPA fallback
        run: npm run verify:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://kingpumpski.github.io/careflow-hub/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published site and built assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          SITE_URL="${SITE_URL/http:/https:}"
          SITE_URL="${SITE_URL%/}/"
          export SITE_URL
          HTTP_URL="${SITE_URL/https:/http:}"
          HTTP_EFFECTIVE_URL="$(curl --silent --show-error --location --max-redirs 5 --output /dev/null --write-out '%{url_effective}' "$HTTP_URL")"
          echo "HTTP redirect destination: $HTTP_EFFECTIVE_URL"
          if [[ "$HTTP_EFFECTIVE_URL" == https://* ]]; then
            echo "HTTP redirects to HTTPS."
          else
            echo "::warning::The HTTP site does not redirect to HTTPS. Enable Enforce HTTPS in repository Settings → Pages."
          fi
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-connrefused "$SITE_URL" -o /tmp/careflow-index.html
          grep -q '<div id="root"></div>' /tmp/careflow-index.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          from urllib.request import urlopen
          import os

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "script" and attrs.get("src"):
                      self.urls.append(attrs["src"])
                  if tag == "link" and attrs.get("rel") == "stylesheet" and attrs.get("href"):
                      self.urls.append(attrs["href"])

          base = os.environ["SITE_URL"]
          parser = Assets()
          parser.feed(open("/tmp/careflow-index.html", encoding="utf-8").read())
          if not parser.urls:
              raise SystemExit("No built JS/CSS assets were referenced by the published page.")
          for asset in parser.urls:
              target = urljoin(base, asset)
              if urlparse(target).netloc != urlparse(base).netloc:
                  continue
              with urlopen(target, timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit(f"Asset failed: {target} returned {response.status}")
              print(f"OK {target}")
          PY

          # GitHub Pages serves the SPA fallback with a 404 status for deep links.
          # Verify that the fallback body still contains the app root.
          curl --silent --show-error --location "$SITE_URL/claims" -o /tmp/careflow-claims.html
          grep -q '<div id="root"></div>' /tmp/careflow-claims.html

          # Reports is the route reported as failing by users. Verify that a
          # direct deep-link request receives the SPA fallback document.
          curl --silent --show-error --location "$SITE_URL/reports" -o /tmp/careflow-reports.html
          grep -q '<div id="root"></div>' /tmp/careflow-reports.html
