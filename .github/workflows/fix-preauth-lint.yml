name: Fix Preauth Form Lint

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/preauthorization-studio
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Rename helper functions that violate React Hooks lint rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/preauth/PreAuthTextFirstForm.tsx')
          s = p.read_text()
          s = s.replace('useSavedPatient', 'loadSavedPatient')
          s = s.replace('useSavedInsurer', 'loadSavedInsurer')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/preauth/PreAuthTextFirstForm.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: resolve preauthorization form hook lint errors'
          git push origin HEAD:feat/preauthorization-studio
      - name: Remove one-shot workflow
        if: always()
        run: |
          git rm .github/workflows/fix-preauth-lint.yml || true
          git diff --cached --quiet || git commit -m 'chore: remove one-shot lint fix workflow'
          git push origin HEAD:feat/preauthorization-studio || true
