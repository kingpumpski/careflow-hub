name: One-time preauthorization facility scope

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-preauth-facility-scope.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused facility-scope patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/PreAuthorizationStudio.tsx')
          text = path.read_text()
          old_import = 'import { createPreAuthorizationAtomic } from "@/features/preauth/services/preauthStudio.service";'
          new_import = old_import + '\nimport { getStoredFacilityId } from "@/features/preauth/services/preauthFacility.service";'
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit('Expected preauthorization service import was not found')
              text = text.replace(old_import, new_import, 1)
          old_block = '''  const reviewRequest = async () => {\n    const id = savedId || await saveDraft();\n    if (!id) return;\n    const { data, error } = await (supabase.from("pre_authorizations") as any).select("id,request_number,status,current_state,procedure_date,duplicate_signature").eq("duplicate_signature", duplicateSignature).neq("id", id).in("status", ["draft", "prepared"]).order("created_at", { ascending: false }).limit(5);'''
          new_block = '''  const reviewRequest = async () => {\n    const id = savedId || await saveDraft();\n    if (!id) return;\n    const facilityId = getStoredFacilityId();\n    if (!facilityId) {\n      toast({ title: "Facility context required", description: "Select a facility before reviewing duplicate requests.", variant: "destructive" });\n      return;\n    }\n    const { data, error } = await (supabase.from("pre_authorizations") as any).select("id,request_number,status,current_state,procedure_date,duplicate_signature").eq("facility_id", facilityId).eq("duplicate_signature", duplicateSignature).neq("id", id).in("status", ["draft", "prepared"]).order("created_at", { ascending: false }).limit(5);'''
          if old_block not in text:
              raise SystemExit('Expected duplicate-review block was not found')
          text = text.replace(old_block, new_block, 1)
          path.write_text(text)
          PY
      - name: Verify patch
        run: |
          grep -F 'getStoredFacilityId' src/pages/PreAuthorizationStudio.tsx
          grep -F '.eq("facility_id", facilityId).eq("duplicate_signature", duplicateSignature)' src/pages/PreAuthorizationStudio.tsx
      - name: Commit focused patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/PreAuthorizationStudio.tsx
          git rm .github/workflows/one-time-preauth-facility-scope.yml
          git commit -m 'fix: scope preauthorization duplicate review by facility'
          git push
