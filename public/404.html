<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareFlow Hub</title>
    <script>
      // Compatibility bridge for old clean-path bookmarks. New application
      // navigation uses #/routes and never requests these server-side paths.
      (function () {
        var base = "/careflow-hub/";
        var path = window.location.pathname;
        if (path.indexOf(base) === 0) path = path.slice(base.length);
        var route = "/" + path.replace(/^\\/+/, "");
        if (route === "/") route = "/";
        window.location.replace(base + "#" + route + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
