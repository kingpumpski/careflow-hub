# All application Edge Functions require an authenticated Supabase JWT.
[functions.chat]
verify_jwt = true

[functions.ai-dedup-check]
verify_jwt = true

[functions.admin-user-action]
verify_jwt = true

[functions.document-transcribe]
verify_jwt = true

[functions.claim-diagnosis-analyze]
verify_jwt = true

# The backup portal accepts only authenticated JWTs and performs admin/R2
# operations server-side. Never disable JWT verification for this function.
[functions.backup-control]
verify_jwt = true

# Called by the managed scheduler (shared secret) and by admins (JWT checked in code).
[functions.system-backup]
verify_jwt = false
